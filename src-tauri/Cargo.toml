[package]
name = "kumanotch"
version = "0.1.0"
description = "Apple-style Dynamic Island for Windows"
authors = ["Fancynest"]
license = "MIT"
repository = "https://github.com/Fancynest/KumaNotch"
edition = "2024"
rust-version = "1.90"
default-run = "kumanotch"

[lib]
name = "app_lib"
crate-type = ["rlib"]
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-drag = "2"
drag = "2"
windows = { version = "0.62", features = [
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Shutdown",
    "Win32_System_Diagnostics_ToolHelp",
] }
windows-core = "0.62"
base64 = "0.22"
notify = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[[bin]]
name = "kumanotch"
path = "src/main.rs"

[[bin]]
name = "kuma"
path = "src/bin/kuma.rs"
test = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

