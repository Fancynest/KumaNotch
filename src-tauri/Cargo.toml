[package]
name = "kumanotch"
version = "0.1.0"
description = "Apple-style Dynamic Island for Windows"
authors = ["Fancynest"]
license = "MIT"
repository = "https://github.com/Fancynest/KumaNotch"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
